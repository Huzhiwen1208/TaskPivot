<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta
      name="description"
      content="星穹手记 —— 一个以 3D 星轨为视觉核心的沉浸式个人博客，记录前端工程、WebGL 与 AI 实践。"
    />
    <title>星穹手记 · Orbit Notes</title>
    <style>
      /* 首屏关键样式内联，避免加载期间出现白屏 */
      html,
      body {
        margin: 0;
        background: #05070f;
        color: #f2f6ff;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 100;
        background:
          radial-gradient(circle at 70% 30%, rgba(103, 232, 249, 0.12), transparent 55%),
          radial-gradient(circle at 25% 70%, rgba(167, 139, 250, 0.14), transparent 50%),
          #05070f;
      }
      .boot__mark {
        font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.5em;
        color: #67e8f9;
        text-align: center;
      }
      .boot__name {
        margin: 18px 0 28px;
        font: 500 clamp(34px, 7vw, 56px) / 1.1 "Songti SC", "Noto Serif SC", serif;
        letter-spacing: 0.12em;
        text-align: center;
      }
      .boot__bar {
        width: min(260px, 56vw);
        height: 1px;
        background: rgba(148, 163, 184, 0.2);
        overflow: hidden;
      }
      .boot__bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #67e8f9, transparent);
        animation: boot-slide 1.2s ease-in-out infinite;
      }
      .boot__status {
        margin-top: 16px;
        font: 400 12px/1.6 ui-monospace, monospace;
        letter-spacing: 0.18em;
        color: #7b8aa8;
        text-align: center;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__bar::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <!-- 3D 画布挂载点：固定定位，置于内容层之下 -->
    <div id="scene-root" aria-hidden="true"></div>
    <div id="app"></div>

    <div class="boot" id="boot" role="status" aria-live="polite">
      <div>
        <p class="boot__mark">ORBIT NOTES</p>
        <p class="boot__name">星穹手记</p>
        <div class="boot__bar"></div>
        <p class="boot__status" id="boot-status">正在校准星轨…</p>
      </div>
    </div>

    <noscript>
      <p style="padding: 24px; font-family: sans-serif">
        本页面需要启用 JavaScript 才能渲染 3D 场景与文章内容。
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
